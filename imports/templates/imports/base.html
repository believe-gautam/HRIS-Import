{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}HRIS import preview{% endblock %}</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #172033;
            --muted: #5f6b7a;
            --line: #dce2ea;
            --surface: #ffffff;
            --canvas: #f4f7fb;
            --brand: #2456d6;
            --brand-dark: #173b9e;
            --danger-bg: #fff3f2;
            --danger: #9b2c24;
            --success-bg: #eefaf3;
            --success: #17663b;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--canvas);
            color: var(--ink);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            line-height: 1.5;
        }
        a { color: var(--brand); }
        .site-nav { background: var(--surface); border-bottom: 1px solid var(--line); }
        .site-nav-inner { display: flex; gap: 24px; margin: auto; padding: 14px 0; width: min(1120px, calc(100% - 32px)); }
        .site-nav a { color: var(--ink); font-weight: 700; text-decoration: none; }
        .site-nav a:hover { color: var(--brand); }
        main { width: min(1120px, calc(100% - 32px)); margin: 36px auto 72px; }
        h1, h2 { line-height: 1.2; }
        h1 { margin-bottom: 8px; font-size: clamp(1.9rem, 4vw, 2.6rem); }
        h2 { margin: 0 0 18px; font-size: 1.2rem; }
        p { margin-top: 0; }
        .lede { color: var(--muted); max-width: 760px; margin-bottom: 28px; }
        .card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 12px;
            box-shadow: 0 4px 18px rgb(23 32 51 / 6%);
            margin-top: 20px;
            padding: 24px;
        }
        .upload-row, .filter-row { display: flex; align-items: end; gap: 16px; flex-wrap: wrap; }
        .field { flex: 1 1 480px; }
        .filter-row .field { flex-basis: 260px; }
        .filter-row .sort-field { flex: 0 1 220px; }
        label { display: block; font-weight: 700; margin-bottom: 8px; }
        input[type="file"], input[type="search"], input[type="number"], select {
            width: 100%;
            border: 1px solid #aeb9c8;
            border-radius: 8px;
            padding: 10px;
            background: #fff;
            color: var(--ink);
            font: inherit;
        }
        .helptext { display: block; color: var(--muted); font-size: .9rem; margin-top: 6px; }
        button, .button-link {
            border: 0;
            border-radius: 8px;
            background: var(--brand);
            color: #fff;
            cursor: pointer;
            display: inline-block;
            font: inherit;
            font-weight: 700;
            padding: 12px 20px;
            text-decoration: none;
        }
        button:hover, .button-link:hover { background: var(--brand-dark); }
        button:disabled { cursor: not-allowed; opacity: .5; }
        button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid #9bb5ff; outline-offset: 2px; }
        .errorlist { color: var(--danger); margin: 8px 0 0; }
        .notice { border-radius: 8px; margin-top: 20px; padding: 12px 16px; }
        .notice.success { background: var(--success-bg); color: var(--success); }
        .metrics { display: grid; grid-template-columns: repeat(5, minmax(130px, 1fr)); gap: 12px; margin-top: 20px; }
        .metric { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
        .metric strong { display: block; font-size: 1.8rem; line-height: 1; margin-bottom: 8px; }
        .metric span { color: var(--muted); font-size: .9rem; }
        .table-controls { display: flex; align-items: end; gap: 16px; flex-wrap: wrap; margin: 20px 0 12px; }
        .table-controls .search-control { flex: 1 1 320px; }
        .table-controls .page-size-control { flex: 0 1 150px; }
        .table-controls label { font-size: .9rem; margin-bottom: 5px; }
        .table-summary { color: var(--muted); font-size: .9rem; margin: 0 0 8px; }
        .table-wrap { overflow-x: auto; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border-bottom: 1px solid var(--line); padding: 11px 12px; text-align: left; vertical-align: top; }
        th { background: #f7f9fc; color: #3e4a5c; font-size: .85rem; text-transform: uppercase; letter-spacing: .025em; }
        .sort-button {
            background: transparent;
            border-radius: 4px;
            color: inherit;
            font-size: inherit;
            letter-spacing: inherit;
            padding: 2px 0;
            text-align: left;
            text-transform: inherit;
            white-space: nowrap;
        }
        .sort-button:hover { background: transparent; color: var(--brand); text-decoration: underline; }
        .sort-indicator { display: inline-block; min-width: 1em; }
        tbody tr:last-child td { border-bottom: 0; }
        td ul { margin: 0; padding-left: 18px; }
        .empty { color: var(--muted); margin-bottom: 0; }
        .explanation, .metadata { color: var(--muted); font-size: .94rem; }
        .explanation { margin-top: -8px; }
        .metadata { display: flex; gap: 8px 24px; flex-wrap: wrap; margin-bottom: 20px; }
        .history-pagination, .pagination { display: flex; align-items: center; justify-content: flex-end; gap: 12px; margin-top: 16px; }
        .pagination { justify-content: space-between; flex-wrap: wrap; }
        .history-pagination { justify-content: space-between; flex-wrap: wrap; }
        .pagination-main, .page-numbers, .page-jump { display: flex; align-items: center; gap: 8px; }
        .pagination button, .history-pagination .button-link { padding: 8px 13px; }
        .page-number { background: #e8eefc; border-radius: 8px; color: var(--brand-dark); display: inline-block; min-width: 40px; padding: 8px 11px; text-align: center; text-decoration: none; }
        .page-number:hover { background: #d7e2ff; }
        .page-number[aria-current="page"] { background: var(--ink); color: #fff; opacity: 1; }
        .page-ellipsis { color: var(--muted); padding: 0 2px; }
        .page-label { color: var(--muted); font-size: .9rem; min-width: 92px; text-align: center; }
        .page-jump label { font-size: .9rem; margin: 0; white-space: nowrap; }
        .page-jump input { padding: 8px; width: 76px; }
        [hidden] { display: none !important; }
        @media (max-width: 760px) {
            main { margin-top: 28px; }
            .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .card { padding: 18px; }
            .pagination, .history-pagination { justify-content: space-between; }
            .pagination-main { justify-content: center; width: 100%; flex-wrap: wrap; }
            .page-jump { justify-content: flex-end; width: 100%; }
        }
    </style>
    <script src="{% static 'imports/results-table.js' %}" defer></script>
</head>
<body>
<nav class="site-nav" aria-label="Primary navigation">
    <div class="site-nav-inner">
        <a href="{% url 'imports:upload' %}">New scan</a>
        <a href="{% url 'imports:history' %}">Scan history</a>
    </div>
</nav>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
